name: Feature idea
description: Suggest something that would help you practise.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in the way
      description: What you are trying to do when you practise, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How TabTrainer could help. A sketch or screenshot is welcome.
    validations:
      required: true
